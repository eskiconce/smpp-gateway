server {
    listen 80;
    server_name smppgw.lan;

    root /var/www/smppgw;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/metrics/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
    }
}
